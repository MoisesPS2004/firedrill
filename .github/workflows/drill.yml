name: drill

on:
  push:
  pull_request:

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install . pytest
      - name: Engine tests
        run: pytest -q tests/
      - name: Static check of the example drill
        working-directory: example
        run: firedrill check
      - name: Run the example drill
        working-directory: example
        run: firedrill run
