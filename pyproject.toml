[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firedrill"
version = "0.1.0"
description = "Planned sabotage drills for your test harness: break things on purpose and verify the alarm actually rings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moises Partida Sarachaga", email = "moises.partida.dev@gmail.com" }]
keywords = ["testing", "mutation-testing", "positive-control", "test-quality", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
firedrill = "firedrill.cli:main"

[project.urls]
Homepage = "https://github.com/MoisesPS2004/firedrill"

[tool.setuptools]
packages = ["firedrill"]
